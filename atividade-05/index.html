<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 05</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="form-box">
        <h2>Cadastro de Alunos</h2>
        <form action="" id="form-cadastro-aluno" class="form-items">
            
            <div class="input-label">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" class="campo" >
            </div>

            <div class="input-label">
                <label for="matricula">Matrícula</label>
                <input type="number" id="matricula" name="matricula" class="campo" >
            </div>

            <div class="input-label">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" class="campo" >
            </div>

            <div class="input-label">
                <label for="curso">Curso</label>
                <input type="text" id="curso" name="curso" class="campo" >
            </div>

            <div class="input-label">
                <label for="periodo">Período</label>
                <input type="text" id="periodo" name="periodo" class="campo" >
            </div>

            <input type="submit" class="btnCadastrar" value="Cadastrar">

            <div id="mensagem">
            </div>
        </form>
    </div>
</body>
</html>
