<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 05</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-box">
        <h2>Cadastro de Alunos</h2>
        <form action="" class="form-items">
            
            <div class="input-label">
                <label for="nome">Nome</label>
                <input type="text" id="nome" class="campo" required>
            </div>

            <div class="input-label">
                <label for="matricula">Matrícula</label>
                <input type="number" id="matricula" class="campo" required>
            </div>

            <div class="input-label">
                <label for="email">E-mail</label>
                <input type="email" id="email" class="campo" required>
            </div>

            <div class="input-label">
                <label for="curso">Curso</label>
                <input type="text" id="curso" class="campo" required>
            </div>

            <div class="input-label">
                <label for="periodo">Período</label>
                <input type="text" id="periodo" class="campo" required>
            </div>

            <input type="submit" class="btnCadastrar" value="Cadastrar" onclick="cadastrarAluno()">
        </form>
    </div>
</body>
</html>
