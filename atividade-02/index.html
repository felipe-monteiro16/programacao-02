<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefas</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <ul>
            <li><a href="#"><i class="fa-solid fa-house"></i> Início</a></li>
            <li class="dropdown">
                <a href="#" class="dropbtn"><i class="fa-solid fa-list-check"></i> Menu <i class="fa-solid fa-caret-down"></i></a>
                <div class="dropdown-content">
                    <a href="#"><i class="fa-solid fa-user"></i> Perfil</a>
                    <a href="#"><i class="fa-solid fa-gear"></i> Configurações</a>
                    <a href="#"><i class="fa-solid fa-circle-info"></i> Sobre</a>
                </div>
            </li>
            <li><a href="#"><i class="fa-solid fa-envelope"></i> Contato</a></li>
        </ul>
    </nav>

    <div id="big-box">
        <h1>Tarefas de Hoje</h1>
        <div id="input-box">
            <input type="text" id="input-txt" placeholder="Digite uma tarefa...">
            <button id="btn-add" onclick="addNewTask()">Adicionar</button>
        </div>
        
        <div id="list-box">
            <ul id="task-list">
                <li><span>Finalizar o Trabalho de Prog</span> <button class="btn-remove" onclick="removeTask(this)">X</button></li>
                <li><span>Estudar Sinais e Sistemas</span> <button class="btn-remove" onclick="removeTask(this)">X</button></li>
            </ul>
        </div>
    </div>
</body>
</html>
