<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculador de Idade</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <div id="form">
        <form method="post" action="calculo.php" class="box">

        </form>
    </div>
